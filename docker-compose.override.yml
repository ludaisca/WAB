services:
  app:
    build:
      target: dev
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "17100:5000"
    volumes:
      - .:/app:z
      - /app/node_modules
      - media_data:/app/media
      - backup_data:/app/backups
      - report_data:/app/reports
    env_file: .env
    environment:
      NODE_ENV: development
    command: >
      sh -c "npx prisma generate && (npx prisma db execute --file prisma/sql/migrate-off-openrouter.sql --schema prisma/schema.prisma || echo 'backfill skipped (columns already dropped)') && npx prisma db push --accept-data-loss && npx prisma db execute --file prisma/sql/ensure-vector-index.sql --schema prisma/schema.prisma && (npx prisma db execute --file prisma/sql/backfill-campaign-costs.sql --schema prisma/schema.prisma || echo 'cost backfill skipped') && (npx prisma db execute --file prisma/sql/backfill-campaign-sent-counts.sql --schema prisma/schema.prisma || echo 'sent-count backfill skipped') && mkdir -p /app/media /app/backups /app/reports && npm run dev"

volumes:
  media_data:
  backup_data:
  report_data:
